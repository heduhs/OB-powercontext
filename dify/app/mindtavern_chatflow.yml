      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\nPROBE = \"读心酒馆 战绩 类别 偏好 回答 习惯 命中 问题数 观察 玩家\"\n\n\ndef main(scope_id: str,\
          \ query: str) -> dict:\n    payload = {\n        \"scope_id\": scope_id,\n        \"query\"\
          : (PROBE + \" \" + (query or \"\").strip())[:1200],\n        \"max_bytes\": 4000,\n        #\
          \ 只要记忆这一族,按 markdown 装配:直接可读,省掉 JSON 信封占的字节预算\n        \"assembly\": {\"format\": \"markdown\"\
          , \"sections\": [{\"family\": \"memory\", \"limit\": 6}]},\n    }\n    return {\"body\": json.dumps(payload,\
          \ ensure_ascii=False)}\n"
        code_language: python3
        desc: 固定探针词 + 客人本轮原话:没配向量模型时,全文检索也能稳定命中战绩条目
        outputs:
          body:
            children: null
            type: string
        selected: false

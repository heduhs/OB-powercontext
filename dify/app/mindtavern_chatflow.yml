          variable: scope_id
        - value_selector:
          - sys
          - query
          variable: query
      height: 82
      id: prep_body
      position:
        x: 1854
        y: 240
      positionAbsolute:
        x: 1854
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:

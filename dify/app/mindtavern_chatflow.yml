        title: 翻账本
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/context/prepare'
        variables: []
      height: 106
      id: http_prep
      position:
        x: 2158
        y: 240
      positionAbsolute:
        x: 2158
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str, status_code: int) -> dict:\n    try:\n        data\
          \ = json.loads(body or \"\")\n    except Exception:\n        data = {}\n    code = int(status_code\
          \ or 0)\n    content = data.get(\"content\")\n    status = data.get(\"status\") or \"empty\"\
          \n    if not isinstance(content, str):\n        content, status = \"\", \"empty\"\n    if not\
          \ 200 <= code < 300:\n        content, status = \"\", \"error\"\n    return {\n        \"mem_block\"\
          : content,\n        \"mem_status\": status,\n        \"mem_bytes\": int(data.get(\"content_bytes\"\
          ) or 0),\n    }\n"
        code_language: python3
        desc: ready / empty / error
        outputs:
          mem_block:
            children: null
            type: string
          mem_bytes:
            children: null
            type: number
          mem_status:
            children: null
            type: string

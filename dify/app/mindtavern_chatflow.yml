    name: PC_BASE_URL
    selector:
    - env
    - PC_BASE_URL
    value: http://host.docker.internal:8100
    value_type: string
  - description: PowerContext 的 Bearer token(POWERCONTEXT_SERVER_AUTH_TOKEN),请改成你自己的值
    id: 6c1bc1d8-aeed-471a-85ee-baa01dd22a97
    name: PC_TOKEN
    selector:
    - env
    - PC_TOKEN
    value: replace-with-your-token
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
    opening_statement: '门帘一掀,老周把头巾往肩上一搭:

      「小店规矩:你在心里想一个东西——食物、动物、物品、地点、人物、虚构,六类里挑一个具体名词。」

      「我只问是/否,你只答是、不是、看情况、不知道、跳过。」

      「我不猜,我等。」


      你可以直接回「开局」,或者先报个称呼。

      '
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开局
    - 我想好了
    - 我这人有什么毛病
    - 老周,上局我输了什么
    - 直接下注
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''

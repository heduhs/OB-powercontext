          variable: status_code
      height: 82
      id: parse_prep
      position:
        x: 2462
        y: 240
      positionAbsolute:
        x: 2462
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:

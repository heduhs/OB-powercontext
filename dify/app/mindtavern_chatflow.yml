    - data:
        code: "import re\n\n\ndef main(user_id: str, conversation_id: str) -> dict:\n    raw = (user_id\
          \ or \"\").strip() or (\"conv-\" + (conversation_id or \"anon\"))\n    key = re.sub(r\"[^A-Za-z0-9_.-]\"\
          , \"-\", raw)[:64]\n    return {\"player_key\": key or \"anon\"}\n"
        code_language: python3
        desc: 用终端用户 ID 当玩家身份:换一个会话、换一个浏览器,只要还是同一个人,老周就还认得
        outputs:
          player_key:
            children: null
            type: string
        selected: false
        title: 玩家身份
        type: code
        variables:
        - value_selector:
          - sys

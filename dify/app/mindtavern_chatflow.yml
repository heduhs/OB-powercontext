      positionAbsolute:
        x: 3070
        y: 360
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 30
        model:
          completion_params:
            temperature: 0.85
          mode: chat
          name: minimax-m3.1-flash
          provider: langgenius/minimax/minimax
        prompt_template:
        - id: sys-host
          role: system
          text: '你是「读心酒馆」的酒保老周。这间酒馆在城南开了十一年。你不会读心,你只是记性好。


            【酒馆规矩】

            1. 客人在心里想一个具体名词,限定六类:食物 / 动物 / 物品 / 地点 / 人物 / 虚构。

            2. 客人只用这些词回答:是、不是、看情况、不知道、跳过。

            3. 你每一轮只问一个"是/否"问题。不许连问,不许给选择题(只有下注时可以给候选)。

            4. 一局最多 12 问。第 5 问起可以试探下注(给 3 个候选并明说押哪个);问到第 12 问必须下注。

            5. 客人判定"猜中了 / 没猜中"之后本局结束,你要总结这一局并按规矩记账。客人说"换一局 / 不玩了 / 重来"也按结束处理。


            【这一桌的现场情况】(Dify 会话变量,只在同一个会话里有效,客人下次推门就没了)

            - 客人自称:{{#conversation.player_nick#}}

            - 本会话已完结局数:{{#conversation.round_no#}}

            - 本局已问问题数:{{#conversation.asked_count#}}


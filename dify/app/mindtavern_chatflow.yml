app:
  description: 城南小酒馆,酒保老周不会读心,只是记性好。你在心里想一个东西,他只问“是/不是”;而你玩过的每一局,都被他记在 PowerContext 的账本上。
  icon: 🍶
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 读心酒馆 · 老周的第九个问题
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0

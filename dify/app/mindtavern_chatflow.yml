    - data:
        code: "import json\n\n\ndef main(body: str, status_code: int) -> dict:\n    try:\n        data\
          \ = json.loads(body or \"\")\n    except Exception:\n        data = {}\n    code = int(status_code\
          \ or 0)\n    sid = (data.get(\"scope_id\") or \"\") if 200 <= code < 300 else \"\"\n    err\
          \ = \"\" if sid else str(data.get(\"error\") or code)[:200]\n    return {\"scope_id\": sid,\
